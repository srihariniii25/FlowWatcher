<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">FlowWatcher: Architecture for Network Observability and Threat Detection</title>
  <desc id="desc">Network traffic flows through collection, analysis, policy response, and console or API integration.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop stop-color="#d9f1ff"/><stop offset="1" stop-color="#c6e6fb"/></linearGradient>
    <linearGradient id="engine" x1="0" x2="1"><stop stop-color="#1974c9"/><stop offset="1" stop-color="#14579b"/></linearGradient>
    <linearGradient id="left" x1="0" x2="1"><stop stop-color="#f0ffed"/><stop offset="1" stop-color="#e0f8dc"/></linearGradient>
    <linearGradient id="right" x1="0" x2="1"><stop stop-color="#f1eaff"/><stop offset="1" stop-color="#e9ddff"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14z" fill="#153d6d"/></marker>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#103d78}.section{font:700 25px Arial,sans-serif;fill:#fff}.heading{font:700 22px Arial,sans-serif;fill:#12355e}.body{font:18px Arial,sans-serif;fill:#143861}.small{font:16px Arial,sans-serif;fill:#143861}.white{fill:#fff}.center{text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="700" fill="#fff"/>
  <rect x="350" y="18" width="900" height="88" rx="14" fill="url(#top)" stroke="#42aef0" stroke-width="3"/>
  <text x="800" y="57" class="title center">FlowWatcher: Architecture for Network Observability</text>
  <text x="800" y="88" class="title center">and Threat Detection</text>

  <rect x="15" y="125" width="270" height="500" rx="14" fill="url(#left)" stroke="#2ba34d" stroke-width="3"/>
  <text x="150" y="160" class="heading center">1. Data Collection</text>
  <g transform="translate(84 185)"><ellipse cx="66" cy="12" rx="45" ry="13" fill="#64b9ed" stroke="#174e96" stroke-width="4"/><path d="M21 12v55c0 8 20 16 45 16s45-8 45-16V12" fill="#5faee5" stroke="#174e96" stroke-width="4"/><ellipse cx="66" cy="67" rx="45" ry="13" fill="none" stroke="#174e96" stroke-width="3"/></g>
  <text x="150" y="287" class="heading center">Network Traffic</text><text x="150" y="313" class="heading center">(Packets)</text><text x="150" y="339" class="small center">Live capture or TAP/SPAN</text>
  <g transform="translate(62 366)"><rect x="10" y="13" width="100" height="59" rx="5" fill="#60b7f0" stroke="#174e96" stroke-width="4"/><path d="M0 78h120l-12 13H12z" fill="#4c9edb" stroke="#174e96" stroke-width="4"/><path d="M27 28h60v34H27z" fill="#d9f3ff"/></g>
  <text x="150" y="503" class="heading center">Distributed Probes</text><text x="150" y="529" class="small center">(Agents / Sensors)</text>
  <g transform="translate(58 550)"><rect x="8" y="0" width="114" height="22" rx="4" fill="#7b9dc2" stroke="#264b72" stroke-width="3"/><rect x="8" y="28" width="114" height="22" rx="4" fill="#6e91b8" stroke="#264b72" stroke-width="3"/><rect x="8" y="56" width="114" height="22" rx="4" fill="#6185ad" stroke="#264b72" stroke-width="3"/></g>
  <text x="150" y="654" class="heading center">Logs &amp; Metrics</text>

  <rect x="345" y="125" width="895" height="500" rx="14" fill="url(#engine)" stroke="#15518d" stroke-width="3"/>
  <text x="792" y="165" class="section center">2. FlowWatcher Analysis Engine</text>
  <rect x="370" y="190" width="255" height="405" rx="12" fill="#edf8ff" stroke="#248edb" stroke-width="3"/><rect x="370" y="190" width="255" height="78" rx="12" fill="#1477cb"/><text x="497" y="224" class="section center" font-size="20">Data Ingestion &amp;</text><text x="497" y="250" class="section center" font-size="20">Flow Building</text>
  <text x="397" y="313" class="body">&#8226; Capture and parse</text><text x="397" y="339" class="body">  packets from network</text><text x="397" y="365" class="body">  and probes</text><text x="397" y="404" class="body">&#8226; Assemble flows</text><text x="397" y="430" class="body">  (5-tuple)</text><text x="397" y="469" class="body">&#8226; Correlate logs with</text><text x="397" y="495" class="body">  flows</text><text x="397" y="534" class="body">&#8226; Enrich with context</text><text x="397" y="560" class="body">  (process, pod, user)</text>
  <rect x="665" y="190" width="255" height="405" rx="12" fill="#effff7" stroke="#12965c" stroke-width="3"/><rect x="665" y="190" width="255" height="78" rx="12" fill="#087b4e"/><text x="792" y="224" class="section center" font-size="20">AI &amp; Behavioral</text><text x="792" y="250" class="section center" font-size="20">Analysis</text>
  <circle cx="792" cy="323" r="39" fill="#fff" stroke="#159768" stroke-width="5"/><path d="M792 287v72M756 323h72M766 297c18 10 18 42 0 52M818 297c-18 10-18 42 0 52" fill="none" stroke="#159768" stroke-width="5"/><text x="692" y="411" class="body">&#8226; Train ML models</text><text x="692" y="449" class="body">&#8226; Extract flow features</text><text x="692" y="487" class="body">&#8226; Behavioral analysis</text><text x="692" y="525" class="body">&#8226; Anomaly detection</text><text x="692" y="563" class="body">&#8226; Assign risk score</text>
  <rect x="960" y="190" width="255" height="405" rx="12" fill="#fff4e8" stroke="#ed7218" stroke-width="3"/><rect x="960" y="190" width="255" height="78" rx="12" fill="#c85e05"/><text x="1087" y="224" class="section center" font-size="20">Policy Engine &amp;</text><text x="1087" y="250" class="section center" font-size="20">Response Orchestration</text><path d="M1087 294l37 15v27c0 29-19 49-37 59-18-10-37-30-37-59v-27z" fill="#ed7218" stroke="#a84b00" stroke-width="3"/><path d="M1087 316v45M1065 338h44" stroke="#fff" stroke-width="5"/><text x="985" y="411" class="body">&#8226; Analyze malicious</text><text x="985" y="437" class="body">  or suspicious flows</text><text x="985" y="476" class="body">&#8226; Apply detection rules</text><text x="985" y="515" class="body">&#8226; Generate alerts</text><text x="985" y="554" class="body">&#8226; Trigger automated</text><text x="985" y="580" class="body">  actions</text>

  <rect x="1300" y="125" width="285" height="500" rx="14" fill="url(#right)" stroke="#8066db" stroke-width="3"/><text x="1442" y="160" class="heading center">3. Console &amp; API</text><text x="1442" y="187" class="heading center">Integration</text><rect x="1330" y="215" width="225" height="165" rx="10" fill="#fff" stroke="#aa91e9" stroke-width="3"/><rect x="1360" y="240" width="165" height="75" fill="#d9efff" stroke="#225185" stroke-width="4"/><path d="M1375 297l35-28 28 20 35-35 30 32" fill="none" stroke="#ef862a" stroke-width="6"/><text x="1442" y="350" class="heading center" font-size="18">FlowWatcher Management</text><text x="1442" y="372" class="heading center" font-size="18">Console &amp; Dashboard</text><text x="1348" y="412" class="small">&#8226; Visualize traffic &amp; threats</text><text x="1348" y="438" class="small">&#8226; View alerts and risk scores</text><text x="1348" y="464" class="small">&#8226; Monitor system status</text><text x="1348" y="490" class="small">&#8226; Generate reports</text><path d="M1410 538c0-26 42-34 54-8 22-13 50 4 43 29h-111c-8-10-2-21 14-21z" fill="#2d8ed5" stroke="#154b8d" stroke-width="3"/><text x="1442" y="594" class="heading center" font-size="18">Automated Action API</text><text x="1442" y="616" class="heading center" font-size="18">&amp; Notification Hub</text>
  <path d="M285 365h55" stroke="#153d6d" stroke-width="7" marker-end="url(#arrow)"/><path d="M1240 365h55" stroke="#153d6d" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="355" y="650" width="885" height="38" rx="10" fill="#edf1f7" stroke="#9aa9bd" stroke-width="2"/><text x="800" y="676" class="heading center" font-size="20">FlowWatcher - Real-time Network Visibility. Smarter Threat Detection.</text>
</svg>
